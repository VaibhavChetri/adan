    - generic [ref=f26e62]:
      - generic [ref=f26e63]:
        - heading "AI and automation in risk and diligence" [level=2] [ref=f26e64]
        - paragraph [ref=f26e65]: This is a description of method, not a claim about past work.
        - paragraph [ref=f26e66]: "Diligence has always involved reading a great deal quickly: contracts, ledgers, policies, board minutes. We use automated tooling to widen what gets read and to flag anomalies for a person to examine — inconsistent terms across a contract set, gaps in a control narrative, figures that do not reconcile between documents."
        - paragraph [ref=f26e67]: What it does not do is form the judgement. Every flag is reviewed by a partner, every conclusion is one a named individual will defend, and nothing reaches a client that has not been checked by someone accountable for it. Where we use these tools on an engagement, we say so in the engagement letter and we explain what was automated and what was not.
      - link "How we apply it" [ref=f26e69] [cursor=pointer]:
        - /url: /en-uk/risk/ai-and-automation-in-risk-and-diligence.html
