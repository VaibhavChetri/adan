    - generic [ref=f26e34]:
      - heading "Who we are" [level=2] [ref=f26e35]
      - paragraph [ref=f26e36]: Adan Corporate is an international advisory firm working with owner-managed and mid-market businesses, private equity, venture capital and family offices. We are UK-registered and work through a partner network rather than a head office.
      - paragraph [ref=f26e37]: "The people advising you have sat on the other side of the table: as chief executives, finance directors and operators who have raised the money, done the deal and lived with the consequences. That is the whole proposition."
