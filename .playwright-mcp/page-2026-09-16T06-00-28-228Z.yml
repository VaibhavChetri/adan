      - paragraph [ref=f14e31]
      - heading "Introduction" [level=4] [ref=f14e32]
      - text: Adan Corporate LLP and its subsidiaries and affiliates (collectively, "Adan", "us" or "we") understand that your privacy is important to you. We are committed to respecting your privacy and protecting your personal data, which is any information that is capable of identifying you as an individual person, collected via all websites or apps that post a link to this Privacy Policy (collectively, "the Sites"). Adan is dedicated to protecting the confidentiality and privacy of information entrusted to us.
      - paragraph [ref=f14e33]
      - paragraph [ref=f14e34]: This Privacy Policy describes how we handle and protect your personal data in connection with the Sites, in our capacity as "Data Controllers". This Privacy Policy also explains what personal data we collect and how it is used. This policy also explains what rights you have over your personal data and how you can use those rights. This Privacy Policy governs our data collection, processing and usage practices. It also describes your choices regarding use, access and correction of your information.
      - paragraph [ref=f14e35]: You have the right to object to some of the processing which Adan carries out. More information about your rights and how to exercise these is set out in the "Your rights" section of this notice. Personal data is any information relating to an identified or identifiable living person. Adan processes company and personal data for numerous purposes, and the means of collection, lawful basis of processing, use, disclosure, and retention periods for each purpose may differ. When collecting and using personal data, our policy is to be transparent about why and how we process personal data. To find out more about our specific processing activities, please go to the relevant sections of this statement.
      - paragraph [ref=f14e36]: "This Privacy Statement is divided into the sections listed below. Click on the links to navigate to the relevant topic:"
      - list [ref=f14e37]:
        - listitem [ref=f14e38]:
          - link "Summary of how we collect data" [ref=f14e39] [cursor=pointer]:
